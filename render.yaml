# =============================================================================
# Intelligent Resume Screening System - Render Cloud Blueprint
# Free Tier Infrastructure Specification (Zero-Cost / No Paid Add-ons)
# =============================================================================

version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. AI Microservice: Python FastAPI
  # ---------------------------------------------------------------------------
  - type: web
    name: resume-screening-ai
    runtime: docker
    dockerfilePath: ./ai-service-python/Dockerfile
    dockerContext: ./ai-service-python
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: AI_SERVICE_HOST
        value: 0.0.0.0
      - key: AI_SERVICE_PORT
        value: "8000"
      - key: LOG_LEVEL
        value: INFO
      # Secure service-to-service API key generated automatically by Render
      - key: AI_SERVICE_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5500,http://127.0.0.1:5500"

  # ---------------------------------------------------------------------------
  # 2. Backend REST API: Java Spring Boot
  # ---------------------------------------------------------------------------
  - type: web
    name: resume-screening-backend
    runtime: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: tidb
      - key: SERVER_PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss512k"

      # Internal AI Service Communication & Authentication
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: resume-screening-ai
          property: hostport
      - key: AI_SERVICE_API_KEY
        fromService:
          type: web
          name: resume-screening-ai
          envVarKey: AI_SERVICE_API_KEY

      # TiDB Cloud Serverless (TLS VERIFY_IDENTITY on port 4000)
      - key: TIDB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_DATABASE
        value: resume_screening_db
      # Credentials are not hardcoded; populated securely in Render Dashboard
      - key: TIDB_USERNAME
        sync: false
      - key: TIDB_PASSWORD
        sync: false

      # Authentication, Security & Cookie Policies
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: intelligent-resume-screening-system
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None
      # Ready for Step 4 frontend URL addition
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5500,http://127.0.0.1:5500"

