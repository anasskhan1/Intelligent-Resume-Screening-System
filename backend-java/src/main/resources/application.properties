# =============================================================================
# Server Configuration
# =============================================================================
server.port=${PORT:${SERVER_PORT:8080}}

# =============================================================================
# Application Configuration
# =============================================================================
spring.application.name=backend-java

# =============================================================================
# MySQL Database Configuration
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:resume_screening_db}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:20000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# =============================================================================
# Spring Data JPA & Hibernate Configuration
# =============================================================================
# Validates schema on startup; will not automatically create or drop tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# Python AI Service Integration
# =============================================================================
ai.service.base-url=${AI_SERVICE_BASE_URL:${AI_SERVICE_URL:http://localhost:8000}}
ai.service.api-key=${AI_SERVICE_API_KEY:}

# =============================================================================
# File Storage Configuration
# =============================================================================
file.upload-dir=${UPLOAD_DIR:uploads/resumes}

# =============================================================================
# Multipart File Upload Configuration
# =============================================================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:500MB}

# =============================================================================
# CORS Configuration
# =============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# =============================================================================
# JWT Configuration
# =============================================================================
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:intelligent-resume-screening-system}

# =============================================================================
# Cookie & Refresh Token Configuration
# =============================================================================
cookie.refresh-token.secure=${COOKIE_SECURE:false}
cookie.refresh-token.same-site=${COOKIE_SAME_SITE:Lax}

# =============================================================================
# Initial Administrator Bootstrap Configuration
# =============================================================================
app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${INITIAL_ADMIN_FIRST_NAME:Admin}
app.bootstrap.admin.last-name=${INITIAL_ADMIN_LAST_NAME:System}



