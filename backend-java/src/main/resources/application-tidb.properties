# ==============================================================================
# TiDB Cloud Profile Configuration (spring.profiles.active=tidb)
# ==============================================================================

server.port=${PORT:${SERVER_PORT:8080}}
ai.service.api-key=${AI_SERVICE_API_KEY:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC URL constructed with strict SSL identity verification (defaults port to 4000, never 3306)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=true&allowPublicKeyRetrieval=false

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Conservative Connection Pool for TiDB Cloud Starter
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=HikariPool-TiDB

# Strict schema validation (no auto DDL execution against cloud database)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# TiDB / MySQL 8 compatible dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

